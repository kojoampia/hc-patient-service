# ===================================================================
# Spring Boot configuration.
#
# This configuration will be overridden by the Spring profile you use,
# for example application-dev.yml if you use the "dev" profile.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

---
# Conditionally disable springdoc on missing api-docs profile
spring:
  config:
    activate:
      on-profile: '!api-docs'
springdoc:
  api-docs:
    enabled: false
---
feign:
  circuitbreaker:
    enabled: true
  # client:
  #   config:
  #     default:
  #       connectTimeout: 5000
  #       readTimeout: 5000
management:
  endpoints:
    web:
      base-path: /management
      exposure:
        include:
          - configprops
          - env
          - health
          - info
          - jhimetrics
          - jhiopenapigroups
          - logfile
          - loggers
          - prometheus
          - threaddump
  endpoint:
    health:
      show-details: when_authorized
      roles: 'ROLE_ADMIN'
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
    jhimetrics:
      enabled: true
  info:
    git:
      mode: full
    env:
      enabled: true
  health:
    mail:
      enabled: false # When using the MailService, configure an SMTP server and set this to true
  prometheus:
    metrics:
      export:
        enabled: true
        step: 60
  observations:
    key-values:
      application: ${spring.application.name}
  metrics:
    enable:
      http: true
      jvm: true
      logback: true
      process: true
      system: true
    distribution:
      percentiles-histogram:
        all: true
      percentiles:
        all: 0, 0.5, 0.75, 0.95, 0.99, 1.0
    data:
      repository:
        autotime:
          enabled: true

mongock:
  migration-scan-package:
    - net.jojoaddison.config.dbmigrations

spring:
  application:
    name: hcPatientService
  cloud:
    consul:
      discovery:
        healthCheckPath: /management/health
        instanceId: hcpatientservice:${spring.application.instance-id:${random.value}}
        service-name: hcpatientservice
      config:
        watch:
          enabled: false
    function:
      # `adminEventConsumer` is a @Bean METHOD NAME, and the binding name is derived from it —
      # rename the method and Spring Cloud Stream has no function to bind, the context still starts,
      # every request is still served, and hc-admin's decisions are silently never applied.
      # PlanVerificationConsumerBindingIT is what stops that being discovered in production.
      #
      # `membershipStreamEvents` is the same trap with a different victim: rename it and every
      # connected browser goes on holding an open stream that nothing will ever write to. Backlog
      # item 39; MembershipStreamRoundTripIT is what can see it.
      #
      # `kafkaConsumer` and `kafkaProducer` were here until 2026-09-18 and were the JHipster scaffold,
      # deleted with it. `kafkaProducer` was a Supplier<String> returning the literal "kakfa_producer",
      # which Spring Cloud Stream polls once a second — so this service published that string to a
      # topic nothing consumed, for ever. See the bindings block below.
      #
      # `patientPlanEventsConsumer` was here until backlog item 47 and is now `adminEventConsumer`. The bean method,
      # both destinations and both copies of this line move together or the consumer silently unbinds — the name is
      # a string in four places and a compile error in none of them. A stale name is its own defect here: the old one
      # said `patientPlanEvents` while reading a channel called `admin.event`.
      definition: adminEventConsumer;membershipStreamEvents
    stream:
      kafka:
        binder:
          replicationFactor: 1
          auto-create-topics: true
          # THIS IS THE PROPERTY THAT GOVERNS SENDS, and it is the one to set in a compose file.
          #
          # backlog item 7. Everything in this subsystem publishes through `StreamBridge`
          # (`PatientEventPublisher`, plus the generated `*KafkaResource`), and StreamBridge goes
          # through the BINDER — so `spring.cloud.stream.kafka.binder.brokers`, overridden as
          # SPRING_CLOUD_STREAM_KAFKA_BINDER_BROKERS, is what decides where an event actually lands.
          # `SPRING_KAFKA_BOOTSTRAP_SERVERS` configures Spring Boot`s own KafkaTemplate/KafkaAdmin,
          # which NOTHING HERE USES. The quality stack sets both and production sets only this one;
          # production is not broken by that, and this note exists so the next person copying a
          # compose file copies the half that matters rather than the other one.
          #
          # DO NOT "FIX" THE DEFAULT BELOW. localhost:9092 is correct for `./mvnw` on a developer
          # machine, which is the one case with no compose file to override it. The defect item 7
          # records is the ABSENCE OF A CHECK, not the value: with no override the service starts,
          # serves, reports healthy, and discards every event it produces. `deploy.sh` asserts the
          # resolved broker since 2026-09-06, and `quality/startup.sh --verify` since 2026-09-05.
          brokers: localhost:9092
        bindings:
          patientEvents-out-0:
            producer:
              # messageKeyExpression yields a String, and the binder's default key serializer is ByteArraySerializer —
              # which fails at send time with a ClassCastException, not at startup. In a service that swallows publish
              # failures by design that is silent: every event is lost and every test still passes.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # Every event about one person lands on one partition. Without this they scatter and "what happened to
              # this patient, in what order" stops being answerable, which is the only question the stream is for.
              messageKeyExpression: headers['patientKey']
          entityEvents-out-0:
            producer:
              # The same ByteArraySerializer trap as the binding above, which cost this repo every event on
              # `patient-events` while every test passed: messageKeyExpression yields a String, the binder's default
              # key serializer is ByteArraySerializer, and the mismatch fails at SEND time rather than at startup —
              # inside a publisher that swallows its failures by design, on a thread of its own. Silent twice over.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              # ⚠ TWO FRAME FAMILIES SHARE THIS ONE EXPRESSION, AND THEY ARE KEYED DIFFERENTLY. This comment said
              # "KEYED ON THE ENTITY, NOT THE PATIENT" until item 46, which was true of everything on the binding
              # when it was written and stopped being true when the binding's traffic widened — the estate's recorded
              # failure mode: a stated reason, correct on the day, quietly invalidated by a change that widened what
              # the setting covers.
              #
              #   type=EntityChanged (notification)  -> entityKey = the ENTITY id
              #   type=CareDelegationChanged  }
              #   type=DeletionRequestChanged }      -> entityKey = the PATIENT's lowercased email
              #
              # ONE HEADER FOR BOTH, DELIBERATELY, so this expression never had to change: it governs the key of
              # every frame on a live cross-product channel, its failure mode is a ClassCastException at SEND time
              # inside a publisher that swallows on a thread of its own, and no test in this repo can protect it
              # because src/test/resources/config/application.yml REPLACES this file rather than merging (item 32).
              # The publisher decides the value; the header's name is therefore only half-honest, which is the price.
              #
              # WHY EACH FAMILY IS KEYED THE WAY IT IS. A notification: two changes to one document must stay in
              # order or the audit trail reports a create and a delete in whichever order two partitions happened to
              # drain, which is a trail asserting the document still exists. A command: its only consumer is a mail
              # dispatcher, and what must not happen is a later change overtaking an earlier one FOR THE SAME PERSON
              # — an angel told their access ended before being told they were nominated. Per-patient ordering is
              # what `patient-events` gives that consumer today and what a command must keep. Keying either family
              # on the actor would order one person's actions and scatter each document's history, which is the
              # wrong half of the guarantee for both. See EntityEventPublisher.KEY_HEADER for the full argument.
              messageKeyExpression: headers['entityKey']
          # THIS REPO'S FIRST DEAD-LETTER QUEUE, and it is here because of what the alternatives do.
          #
          # A frame this consumer cannot apply — unreadable bytes, no subject, a plan that disagrees with the
          # membership — throws. Without a DLQ the binder's default (`autoCommitOnError` follows `autoCommitOffset`,
          # both true) LOGS AND COMMITS THE OFFSET: the acknowledgement is discarded, an administrator's decision
          # never takes effect, and nothing in this stack alerts on a log line. Turning that off instead
          # (`autoCommitOnError: false`) is worse — the container seeks back and redelivers the same poison for ever,
          # so one bad frame stalls the partition and every LATER patient's verification queues behind it.
          # The DLQ is the third answer: keep the bytes where they can be read and replayed, advance the offset,
          # take the next frame. A poison frame must cost one patient, never the binding.
          adminEventConsumer-in-0:
            consumer:
              # EXPLICIT BECAUSE IT IS THE JUSTIFICATION FOR THE BUILD ORDER, not because the default differs.
              # Item 19 built this consumer before hc-admin's publisher on the argument that a consumer nobody
              # publishes to "idles, loses nothing, and the day the producer starts the backlog on the topic drains
              # into it". THAT SENTENCE IS ONLY TRUE WITH `earliest`. On `latest` a group created before the producer
              # existed would skip every frame published before its first poll — the backlog would be silently
              # discarded and the loop would look healthy. hc-admin sets theirs explicitly with the same reasoning.
              #
              # ⚠ ITEM 47 MAKES THIS COST SOMETHING FOR EXACTLY ONE START, and it is kept anyway. Kafka scopes offsets
              # per (group, topic), so moving to `admin.event` means this group arrives with no committed offset and
              # replays the whole channel once — 7435 frames as of 2026-09-25, of which 7433 are hc-admin's entity
              # changes. That is affordable ONLY because PlanVerificationConsumer dispatches on `type` before it does
              # anything else, so a frame that is not ours costs a string comparison and no database read. It would be
              # catastrophic with the item 19 ordering, which dead-lettered an unrecognised type: 7433 dead letters,
              # four handlings each. Do not reorder those checks without reading this line.
              #
              # `latest` was the alternative and it loses a decision: hc-admin has been publishing here since their
              # item 145 roll, so a verification pressed between their deploy and ours is in that backlog, and skipping
              # it leaves a membership PENDING for ever with no lag and no dead letter to show for it.
              #
              # `resetOffsets` stays at its default of false, which is the half that matters afterwards: startOffset
              # applies only while the group has no committed offset, so this cannot re-read the channel on a restart.
              startOffset: earliest
              enableDlq: true
              # `<destination>.<who-dead-lettered-it>`, which is the shape hc-admin already uses for the other
              # direction (`patient-events.hc-admin-dlq`). The binder's default name is `error.<destination>.<group>`
              # and would be the only topic in the estate not following that convention. The convention carries across
              # with the destination: this was `patient-events-plan.hc-patient-dlq` until item 47, and the product
              # naming half of it is which product could not apply the frame, not which one sent it — hc-professional
              # and hc-vendor will each have their own on this same channel.
              dlqName: admin.event.hc-patient-dlq
          # The patient-facing fan-out. Keyed on patientId rather than on the email every other topic
          # here uses: both ends of this one are in this repository and both already hold the id, so
          # keying on it costs no profile lookup inside a Kafka handler and cannot file an event under
          # an administrator who acted for somebody. The header name is the same so the YAML has one
          # spelling; the value differs. See MembershipStreamPublisher.
          membershipEvents-out-0:
            producer:
              # messageKeyExpression yields a String, and the binder's default key serializer is
              # ByteArraySerializer — which fails at send time with a ClassCastException, not at
              # startup, in a publisher that swallows its failures by design.
              configuration:
                key.serializer: org.apache.kafka.common.serialization.StringSerializer
              messageKeyExpression: headers['patientKey']
          membershipStreamEvents-in-0:
            consumer:
              # DELIBERATE, AND THE OPPOSITE OF EVERY OTHER CONSUMER HERE. `latest` because this
              # stream does not replay: a client that was disconnected re-fetches on reconnect
              # (backlog item 39), so an instance starting up must not push a backlog of historic
              # status changes at whoever connects to it first. Stated explicitly because the binding
              # has no group and would inherit `latest` anyway — that is a binder detail, and this
              # depends on it.
              startOffset: latest
              # NO DLQ, unlike the binding above. A frame here is a notice, not a decision; the worst
              # a lost one costs is a browser that refreshes when the patient next opens it. A queue
              # of missed notices is not something anybody would read.
      bindings:
        # ⚠ NO GROUP ON membershipStreamEvents-in-0, AND IT IS THE WHOLE DESIGN. Every other binding
        # in this file names `hc-patient-service` so that one deployment consumes each topic once.
        # This one must not: the work is "tell the browsers attached to YOU", and a browser is
        # attached to exactly one instance. With a group, a frame goes to one instance and the
        # patients connected to the others are never told — intermittently, in proportion to the
        # replica count, with nothing failing. Left without one, Spring Cloud Stream assigns an
        # anonymous group unique per instance and per start, which is the pub/sub semantics this
        # needs. Backlog item 39; MembershipStreamConsumer's javadoc carries the argument.
        membershipEvents-out-0:
          destination: patient-membership-events
          content-type: application/json
        membershipStreamEvents-in-0:
          destination: patient-membership-events
          content-type: application/json
        # The patient journey — account lifecycle, onboarding progress and care delegation, all on one topic.
        # One topic rather than several because per-patient ordering is the property that makes the stream useful,
        # and Kafka only guarantees it within a partition. The gateway publishes its half to the same destination.
        patientEvents-out-0:
          destination: patient-events
          content-type: application/json
        # EVERY ENTITY CHANGE IN THIS SUBSYSTEM — hc-admin turns each frame into one audit row. Backlog item 45,
        # under the estate decision of 2026-09-17: one channel per product carrying all entity CRUD, so a new
        # consumer subscribes rather than negotiating a topic with its producer.
        #
        # A NEW TOPIC, NOT `patient-events` WIDENED, and the name is dotted-singular rather than this repo's
        # hyphenated-plural convention. `patient-events` is a LIFECYCLE stream: seven curated moments that matter to
        # a subscriber's model, with a live hc-admin consumer and this subsystem's own gateway mail router on it.
        # An audit trail needs every write, which is a different stream. The four channels are patient.event,
        # professional.event, vendor.event and admin.event — hc-professional already publishes dotted-singular, and
        # two products cannot each keep their own convention and also be consumed uniformly. Retiring the old topic
        # is item 46 and is deliberately NOT this change: add first, remove nothing.
        #
        # DECLARED HERE RATHER THAN LEFT TO StreamBridge, which creates a destination on the fly for a binding name
        # it does not recognise — a working publisher writing to a topic declared in no config and read by nothing.
        # hc-admin shipped exactly that with `roster-events` and nobody noticed for months.
        entityEvents-out-0:
          destination: patient.event
          content-type: application/json
        # The return leg, and the only channel this service consumes that it does not own: hc-admin publishes an
        # administrator's decision on a plan here and this service applies it. Backlog items 19 and 47.
        #
        # ⚠ `patient-events-plan` WAS THE DESTINATION UNTIL ITEM 47 AND IS GONE FROM THIS FILE. The estate decision of
        # 2026-09-17 gives each product one channel carrying everything it has to say, and hc-admin's is `admin.event`.
        # Their item 145 publishes the verification to BOTH for now and retires the old topic once this consumer's lag
        # on it reaches zero — which it was when this changed (group hc-patient-service, offset 4 of 4, 2026-09-25).
        # REMOVE THE CONSUMER BEFORE THE PRODUCER: a producer writing where nobody reads is harmless, a consumer
        # reading where nobody writes is silence that looks like health.
        #
        # THE FRAME IS NOT THE SAME SHAPE ON THE TWO TOPICS, which is the part a destination change alone gets wrong.
        # On the old topic hc-admin sent this repo's own PatientEvent envelope with the address in `subject.email`;
        # on this channel `subject` is (entityType, entityId) — the DirectoryLink they acted on — and the address is
        # in `data.subjectKey`. See AdminEvent and PlanVerificationConsumer.
        #
        # A CHANNEL SHARED WITH TWO OTHER PRODUCTS, so most of what arrives is addressed to somebody else and is
        # ignored rather than dead-lettered. The DLQ above therefore still holds only plan verifications this service
        # could not apply.
        #
        # THE GROUP IS WHAT MAKES A REPLICA A REPLICA. Without it every running instance receives every
        # decision and each one tries the same PENDING → ACTIVE write. The name matches the other three
        # bindings deliberately: Kafka scopes offsets per (group, topic), so one name across bindings is one
        # deployment consuming each topic once, not one queue shared between unrelated streams.
        adminEventConsumer-in-0:
          destination: admin.event
          content-type: application/json
          group: hc-patient-service
          consumer:
            # Explicit rather than left at the identical default, because it is half of the DLQ's behaviour and a
            # reader should not have to know the default to work out how long a refusal takes to reach the DLQ.
            # The retries buy a transient Mongo blip; a refusal is deterministic and simply refuses again.
            #
            # MEASURED, because the arithmetic is not what the name suggests: under Spring Integration's retry policy
            # this is the number of RETRIES AFTER the first delivery, so a poison frame is handled four times — at
            # roughly 0s, 1s, 3s and 7s with the default backoff — and is dead-lettered about eight seconds after it
            # arrives. An operator seeing one event id four times in the log is seeing one frame, not four.
            #
            # THE BACKOFF IS LEFT AT ITS DEFAULTS HERE AND OVERRIDDEN IN THE TEST CONFIG, which is the only place
            # these two files intentionally differ on this binding. Eight seconds per refusal is right in production
            # and made the round-trip suite take 225 seconds; the retry COUNT is the same in both, so the tests
            # exercise production's behaviour on a shorter clock. See the note in src/test/resources/config.
            maxAttempts: 3
  profiles:
    # The commented value for `active` can be replaced with valid Spring profiles to load.
    # Otherwise, it will be filled in by maven when building the JAR file
    # Either way, it can be overridden by `--spring.profiles.active` value passed in the commandline or `-Dspring.profiles.active` set in `JAVA_OPTS`
    active: #spring.profiles.active#
    group:
      dev:
        - dev
        - api-docs
        # Uncomment to activate TLS for the dev profile
        #- tls
  jmx:
    enabled: false
  messages:
    basename: i18n/messages
  main:
    allow-bean-definition-overriding: true
  mvc:
    problemdetails:
      enabled: true
  task:
    execution:
      thread-name-prefix: hc-patient-service-task-
      pool:
        core-size: 2
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: hc-patient-service-scheduling-
      pool:
        size: 2
  thymeleaf:
    mode: HTML
  # A report is a clinic PDF or a photograph of a lab slip. Spring's defaults are 1 MB for a file and 10 MB for the
  # request, which rejects an ordinary phone photograph; ReportFileService enforces the same 10 MB itself, so this
  # only has to stop being the tighter of the two limits.
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  output:
    ansi:
      console-available: true

server:
  servlet:
    session:
      cookie:
        http-only: true

springdoc:
  show-actuator: true

# Properties to be exposed on the /info management endpoint
info:
  # Comma separated list of profiles that will trigger the ribbon to show
  display-ribbon-on-profiles: 'dev'

